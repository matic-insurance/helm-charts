{{- if .Values.egress.enabled }}
{{- range $_, $destination := .Values.destinations }}
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: {{ include "application-mesh.component-fullname" (merge (dict "component" $destination.component) $) }}
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: {{ include "application-helpers.name" $ }}
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
  - hosts:
    - istio-ingress/*
    - istio-system/*
{{- /* In-mesh neighbours. REGISTRY_ONLY denies anything not listed here, and
       that includes services in the workload's own namespace. These are already
       in the registry, so they need a Sidecar entry only - no ServiceEntry,
       Gateway or VirtualService, which is why they are not part of allowlist. */}}
{{- range $_, $host := $.Values.egress.internal_allowlist }}
    - "./{{ $host }}"
{{- end }}
{{- range $_, $egress := $.Values.egress.allowlist }}
{{- range $host := compact (append ($egress.hosts | default list) ($egress.host)) }}
    - "./{{ $host }}"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
