{{- if .Values.egress.enabled }}
{{- range $_, $destination := .Values.destinations }}
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: {{ include "application-mesh.component-fullname" (merge (dict "component" $destination.component) $) }}
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: {{ include "application-helpers.name" $ }}
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
  - hosts:
    - istio-ingress/*
    - istio-system/*
{{- /* The workload's own namespace. REGISTRY_ONLY denies anything not listed
       here, and that includes in-mesh neighbours, so without this every
       service-to-service call fails as a sidecar 502 on block_all. These hosts
       are already in the registry and need no ServiceEntry, which is why
       allowlist - that builds MESH_EXTERNAL entries - cannot express them. */}}
    - "./*"
{{- range $_, $egress := $.Values.egress.allowlist }}
{{- range $host := compact (append ($egress.hosts | default list) ($egress.host)) }}
    - "./{{ $host }}"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
