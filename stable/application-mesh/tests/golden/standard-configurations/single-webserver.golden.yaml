# Source: application-mesh/templates/egress-sidecar.yaml
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: best-product-webserver
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/instance: best-product-webserver
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  egress:
  - hosts:
    - istio-ingress/*
    - istio-system/*
