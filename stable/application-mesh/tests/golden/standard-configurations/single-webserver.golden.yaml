# Source: application-mesh/templates/egress.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: egress-best-product-db
spec:
  exportTo:
    - "*"
  hosts:
    - best-product-staging.aws.db
  gateways:
    - mesh
    - egress-best-product-db
  tls:
    - match:
        - gateways:
            - mesh
          sourceLabels:
            app.kubernetes.io/instance: best-product-webserver
          port: 5432
          sniHosts:
            - best-product-staging.aws.db
      route:
        - destination:
            host: istio-egress-gateway.istio-ingress.svc.cluster.local
            port:
              number: 5432
          weight: 100
    - match:
        - gateways:
            - egress-best-product-db
          port: 443
          sniHosts:
            - best-product-staging.aws.db
      route:
        - destination:
            host: best-product-staging.aws.db
            port:
              number: 5432
          weight: 100
