global:
  application:
    product: best-product
    environment: test
    version: "release-2023-08-30-02"

  applicationMonitoring:
    datadog: true

destinations:
  - component: webserver

ingress:
  - host: best-product-st2.example.com
    gateway: wildcard-example-com
    destination: webserver
    deny_locations:
      - /admin
  - host: best-product-st2.example.link
    gateway: wildcard-matic-link
    destination: webserver

egress:
  enabled: true
  allowlist:
    - name: db
      type: postgres
      host: best-product-staging.aws.db
    - full_name: datagotix
      type: https
      host: datagotix.com
