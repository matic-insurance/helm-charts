# Source: application-mesh/templates/gateway.yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: best-product-st1-example-com
  annotations:
    # Do not create dns records for this resource
    external-dns.alpha.kubernetes.io/controller: "ignored-resource"
  labels:
    app.kubernetes.io/part-of: best-product
    app.kubernetes.io/version: "0.0.0"
spec:
  selector:
    istio: ingress-public-gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "best-product-st1.example.com"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "best-product-st1.example.com"
      tls:
        mode: SIMPLE
        credentialName: istio-ingress/best-product-st1-example-com-tls
---
