apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: best-product-st1-tls-example-com
  annotations:
    # Do not create dns records for this resource
    external-dns.alpha.kubernetes.io/controller: "ignored-resource"
  labels:
    app.kubernetes.io/part-of: best-product
    app.kubernetes.io/version: "0.0.0"
spec:
  selector:
    istio: ingress-public-gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "best-product-st1-tls.example.com"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "best-product-st1-tls.example.com"
      tls:
        mode: SIMPLE
        credentialName: istio-ingress/best-product-st1-tls-example-com-tls
        minProtocolVersion: TLSV1_1
        cipherSuites:
          - ECDHE-RSA-AES128-SHA
          - ECDHE-RSA-AES256-SHA
          - AES128-SHA
          - AES256-SHA
